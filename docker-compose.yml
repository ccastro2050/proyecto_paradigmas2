# ==============================================================
# Proyecto Paradigmas — versión 1
#
#   API FACTURAS (FastAPI, :8003) — CRUD de producto
#        └── PostgreSQL (:15433 hacia el host) — bdfacturas completa
#
# Uso:  docker compose up -d --build      (un solo comando)
# Este archivo CRECE con las versiones: v3 suma MariaDB,
# v4 suma SQL Server, v5 el front.
# ==============================================================
services:

  # --- Base de datos: PostgreSQL 16 con bdfacturas completa ---
  postgres:
    restart: unless-stopped   # si el PC se reinicia, este servicio revive con Docker
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bdfacturas_postgres_local
      POSTGRES_USER: paradigmas
      POSTGRES_PASSWORD: paradigmas123
    volumes:
      - pgdata:/var/lib/postgresql/data                          # los datos sobreviven a down/reinicios
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro    # se ejecuta solo con volumen vacío
    ports:
      - "15433:5432"     # puerto en su PC (para DBeaver/pgAdmin opcional)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paradigmas -d bdfacturas_postgres_local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # --- API Facturas v1 (CRUD de producto) ---
  api-facturas:
    build: ./api_facturas
    volumes:
      - ./api_facturas:/app        # el código se monta: guardar un .py recarga solo
    command: uvicorn main:app --host 0.0.0.0 --port 8003 --reload
    restart: unless-stopped
    ports:
      - "8003:8003"                # http://localhost:8003/docs
    environment:
      # Entre contenedores se usa el NOMBRE del servicio (postgres), no localhost
      DB_POSTGRES: postgresql+asyncpg://paradigmas:paradigmas123@postgres:5432/bdfacturas_postgres_local
    depends_on:
      postgres:
        condition: service_healthy   # arranca cuando la BD RESPONDE, no cuando existe

volumes:
  pgdata:
